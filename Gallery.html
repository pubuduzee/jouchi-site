<script>
    var fullImgBox = document.getElementById("fullImgBox");
    var fullImg = document.getElementById("fullImg");
    
    // Get all gallery images into an array
    var images = Array.from(document.querySelectorAll('.gallery-thumb'));
    var currentIndex = 0;

    function openFullImg(src) {
        fullImgBox.style.display = "flex";
        fullImg.src = src;
        // Update the current index based on the clicked image
        currentIndex = images.findIndex(img => img.src === src);
    }

    function closeFullImg() {
        fullImgBox.style.display = "none";
    }

    function changeImg(direction) {
        currentIndex += direction;

        // Loop back to start/end
        if (currentIndex >= images.length) {
            currentIndex = 0;
        } else if (currentIndex < 0) {
            currentIndex = images.length - 1;
        }

        fullImg.src = images[currentIndex].src;
    }

    // Keyboard support: Use arrow keys to navigate
    document.addEventListener('keydown', function(e) {
        if (fullImgBox.style.display === "flex") {
            if (e.key === "ArrowLeft") changeImg(-1);
            if (e.key === "ArrowRight") changeImg(1);
            if (e.key === "Escape") closeFullImg();
        }
    });
</script>
